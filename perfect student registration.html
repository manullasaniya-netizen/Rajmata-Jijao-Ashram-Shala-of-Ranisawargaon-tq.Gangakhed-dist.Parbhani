<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
     * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #eef2f7;
    padding: 30px 15px;
}

/* FORM CONTAINER */

.form-container {
    width: 100%;
    max-width: 550px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* HEADING */

h1 {
    text-align: center;
    color: #17365d;
    margin-bottom: 10px;
}

p {
    text-align: center;
    color: gray;
    margin-bottom: 25px;
}

/* LABEL */

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
    color: #17365d;
}

/* INPUT AND SELECT */

input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

/* TEXTAREA */

textarea {
    height: 90px;
    resize: vertical;
}

/* BUTTON */

button {
    width: 100%;
    padding: 13px;
    margin-top: 25px;
    background-color: #17365d;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background-color: #24558c;
}

/* MESSAGE */

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

/* RESPONSIVE */

@media(max-width: 600px) {
    .form-container {
        padding: 20px;
    }
}

/* BACK BUTTON */

.back-btn {
    display: block;
    width: fit-content;
    margin: 25px auto;
    padding: 12px 25px;
    background-color: #17365d;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}
</style>
</head>
